<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="360" viewBox="0 0 512 180">

  <defs>
    <radialGradient id="background" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#10102d"/>
      <stop offset="100%" stop-color="#03030d"/>
    </radialGradient>

    <radialGradient id="planet">
      <stop offset="0%" stop-color="#a99aff"/>
      <stop offset="100%" stop-color="#6546e8"/>
    </radialGradient>

    <radialGradient id="sun">
      <stop offset="0%" stop-color="#c7bdff"/>
      <stop offset="55%" stop-color="#795cff"/>
      <stop offset="100%" stop-color="#38217c"/>
    </radialGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="180" fill="url(#background)"/>

  <!-- Twinkling stars -->
  <g fill="#c5bbff">
    <circle cx="44" cy="79" r="1">
      <animate attributeName="opacity" values=".2;1;.2"
               dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="91" cy="35" r=".8">
      <animate attributeName="opacity" values="1;.25;1"
               dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="315" cy="43" r="1">
      <animate attributeName="opacity" values=".2;1;.2"
               dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="462" cy="110" r=".9">
      <animate attributeName="opacity" values="1;.2;1"
               dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="395" cy="145" r=".8">
      <animate attributeName="opacity" values=".2;1;.2"
               dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Header -->
  <text x="22" y="22"
        fill="#c8c0ff"
        font-size="5"
        font-family="Arial, sans-serif"
        letter-spacing="1.2">
    ARIA SHOKROLLAHI / DIGITAL UNIVERSE
  </text>

  <text x="490" y="22"
        text-anchor="end"
        fill="#8f88b8"
        font-size="4"
        font-family="Arial, sans-serif"
        letter-spacing=".7">
    DESIGN · BUILD · EXPLORE
  </text>

  <!-- Orbits -->
  <g fill="none" stroke="#6556c9" stroke-width=".65" opacity=".55">
    <ellipse cx="256" cy="91" rx="180" ry="62"/>
    <ellipse cx="256" cy="91" rx="152" ry="47"
             transform="rotate(-12 256 91)"/>
    <ellipse cx="256" cy="91" rx="124" ry="34"
             transform="rotate(12 256 91)"/>
  </g>

  <!-- Central sun glow -->
  <circle cx="256" cy="91" r="25" fill="#795cff" opacity=".16" filter="url(#glow)">
    <animate attributeName="r" values="23;28;23"
             dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".1;.24;.1"
             dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Central sun -->
  <circle cx="256" cy="91" r="17"
          fill="url(#sun)" stroke="#b6aaff" stroke-width=".8"/>

  <circle cx="256" cy="91" r="12"
          fill="none" stroke="#ddd7ff" opacity=".55">
    <animate attributeName="r" values="12;15;12"
             dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;.15;.7"
             dur="3s" repeatCount="indefinite"/>
  </circle>

  <text x="256" y="95"
        text-anchor="middle"
        fill="#ffffff"
        font-size="12"
        font-weight="bold"
        font-family="Arial, sans-serif">
    AS
  </text>

  <!-- Moving planets and labels -->
  <g font-family="Arial, sans-serif"
     text-anchor="middle"
     fill="#e0d9ff"
     filter="url(#glow)">

    <!-- Figma -->
    <g>
      <circle r="7" fill="url(#planet)" stroke="#c5baff" stroke-width=".7"/>
      <text y="-11" font-size="4.5">FIGMA</text>
      <animateMotion dur="12s" repeatCount="indefinite"
        path="M76 91 A180 62 0 1 0 436 91 A180 62 0 1 0 76 91"/>
    </g>

    <!-- CSS -->
    <g>
      <circle r="5.5" fill="url(#planet)" stroke="#c3b8ff" stroke-width=".7"/>
      <text y="-10" font-size="4.5">CSS</text>
      <animateMotion dur="9s" begin="-3s" repeatCount="indefinite"
        path="M104 91 A152 47 0 1 0 408 91 A152 47 0 1 0 104 91"/>
    </g>

    <!-- JavaScript -->
    <g>
      <circle r="4.5" fill="url(#planet)" stroke="#e0d9ff" stroke-width=".7"/>
      <text y="-9" font-size="4.5">JAVASCRIPT</text>
      <animateMotion dur="7s" begin="-1s" repeatCount="indefinite"
        path="M132 91 A124 34 0 1 0 380 91 A124 34 0 1 0 132 91"/>
    </g>

    <!-- HTML -->
    <g>
      <circle r="5" fill="url(#planet)" stroke="#c5baff" stroke-width=".7"/>
      <text y="-10" font-size="4.5">HTML</text>
      <animateMotion dur="15s" begin="-5s" repeatCount="indefinite"
        path="M76 91 A180 62 0 1 0 436 91 A180 62 0 1 0 76 91"/>
    </g>
  </g>

  <!-- Footer -->
  <text x="256" y="166"
        text-anchor="middle"
        fill="#c8c0ff"
        font-size="5"
        font-family="Arial, sans-serif"
        letter-spacing="1.1">
    MY SKILLS ARE THE PLANETS. MY PROJECTS ORBIT AROUND CURIOSITY.
  </text>
</svg>
