<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="360" viewBox="0 0 512 180">

  <defs>
    <radialGradient id="bg">
      <stop offset="0" stop-color="#10102d"/>
      <stop offset="1" stop-color="#03030d"/>
    </radialGradient>

    <radialGradient id="sun">
      <stop offset="0" stop-color="#a89cff"/>
      <stop offset=".55" stop-color="#674cff"/>
      <stop offset="1" stop-color="#24145f"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="orbit1" d="M76 91 A180 62 0 1 0 436 91 A180 62 0 1 0 76 91"/>
    <path id="orbit2" d="M104 91 A152 47 0 1 0 408 91 A152 47 0 1 0 104 91"/>
    <path id="orbit3" d="M132 91 A124 34 0 1 0 380 91 A124 34 0 1 0 132 91"/>
  </defs>

  <rect width="512" height="180" fill="url(#bg)"/>

  <!-- ستاره‌ها -->
  <g fill="#aaa2ff">
    <circle cx="44" cy="79" r="1">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="91" cy="35" r=".8">
      <animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="315" cy="43" r="1">
      <animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="462" cy="110" r=".9">
      <animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="395" cy="145" r=".8">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- عنوان -->
  <text x="22" y="22" fill="#c8c0ff" font-size="5"
        font-family="Arial, sans-serif" letter-spacing="1.2">
    ARIA SHOKROLLAHI / DIGITAL UNIVERSE
  </text>
  <text x="490" y="22" text-anchor="end" fill="#8f88b8"
        font-size="4" font-family="Arial, sans-serif" letter-spacing=".7">
    DESIGN · BUILD · EXPLORE
  </text>

  <!-- مدارها -->
  <g fill="none" stroke="#6556c9" stroke-width=".65" opacity=".55">
    <ellipse cx="256" cy="91" rx="180" ry="62"/>
    <ellipse cx="256" cy="91" rx="152" ry="47" transform="rotate(-12 256 91)"/>
    <ellipse cx="256" cy="91" rx="124" ry="34" transform="rotate(12 256 91)"/>
  </g>

  <!-- مسیرهای حرکت مخفی -->
  <g fill="none" opacity="0">
    <use xlink:href="#orbit1"/>
    <use xlink:href="#orbit2"/>
    <use xlink:href="#orbit3"/>
  </g>

  <!-- هستهٔ مرکزی -->
  <circle cx="256" cy="91" r="25" fill="#795cff" opacity=".14" filter="url(#glow)">
    <animate attributeName="r" values="23;28;23" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".1;.24;.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="91" r="17" fill="url(#sun)" stroke="#b6aaff" stroke-width=".8"/>
  <circle cx="256" cy="91" r="12" fill="none" stroke="#ddd7ff" opacity=".55">
    <animate attributeName="r" values="12;15;12" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;.15;.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="256" y="94" text-anchor="middle" fill="white"
        font-size="12" font-weight="bold" font-family="Arial, sans-serif">AS</text>

  <!-- سیاره‌های متحرک -->
  <g filter="url(#glow)">
    <circle r="7" fill="#8067ff" stroke="#c5baff" stroke-width=".7">
      <animateMotion dur="12s" repeatCount="indefinite">
        <mpath xlink:href="#orbit1"/>
      </animateMotion>
    </circle>
    <circle r="5.5" fill="#6e55ed" stroke="#c3b8ff" stroke-width=".7">
      <animateMotion dur="9s" repeatCount="indefinite" begin="-3s">
        <mpath xlink:href="#orbit2"/>
      </animateMotion>
    </circle>
    <circle r="4.5" fill="#987eff" stroke="#e0d9ff" stroke-width=".7">
      <animateMotion dur="7s" repeatCount="indefinite" begin="-1s">
        <mpath xlink:href="#orbit3"/>
      </animateMotion>
    </circle>
  </g>

  <!-- برچسب‌ها -->
  <g fill="#c8c0ff" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="109" y="56" font-size="4.5">FIGMA</text>
    <text x="134" y="139" font-size="4.5">CSS</text>
    <text x="382" y="139" font-size="4.5">JAVASCRIPT</text>
    <text x="402" y="58" font-size="4.5">HTML</text>
  </g>

  <text x="256" y="166" text-anchor="middle" fill="#c8c0ff"
        font-size="5" font-family="Arial, sans-serif" letter-spacing="1.1">
    MY SKILLS ARE THE PLANETS. MY PROJECTS ORBIT AROUND CURIOSITY.
  </text>
</svg>
